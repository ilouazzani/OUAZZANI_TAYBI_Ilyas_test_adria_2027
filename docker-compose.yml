version: '3.8'

services:
  # -------------------------------------------------------------
  # Infrastructure Messaging (Apache Kafka & Zookeeper)
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bank-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bank-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bank-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bank-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-bank-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - bank-net

  # -------------------------------------------------------------
  # Technical Microservices (Discovery, Config & Gateway)
  # -------------------------------------------------------------
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: bank-discovery-service
    ports:
      - "8761:8761"
    networks:
      - bank-net

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: bank-config-service
    depends_on:
      - discovery-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    networks:
      - bank-net

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: bank-gateway-service
    depends_on:
      - discovery-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    networks:
      - bank-net

  # -------------------------------------------------------------
  # Business Microservices (Account & Transaction)
  # -------------------------------------------------------------
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: bank-account-service
    depends_on:
      - discovery-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    networks:
      - bank-net

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: bank-transaction-service
    depends_on:
      - discovery-service
      - kafka
      - account-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
    networks:
      - bank-net

  # -------------------------------------------------------------
  # AI Agent Chatbot (Spring AI & MCP)
  # -------------------------------------------------------------
  ai-agent-service:
    build:
      context: .
      dockerfile: ai-agent-service/Dockerfile
    container_name: bank-ai-agent-service
    depends_on:
      - discovery-service
      - account-service
      - transaction-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
    networks:
      - bank-net

networks:
  bank-net:
    driver: bridge
